# vim: ft=tmux
# Solarized Osaka (craftzdog/solarized-osaka.nvim) + floating-style window list.
# Must be sourced AFTER TPM so it overrides any plugin defaults.
#
# Palette:
#   base04 #00141a  base03 #002d38  base02 #073541  base01 #586e74
#   base0  #9fabad  base1  #adb8b8  blue   #278bd3  cyan   #2aa298
#   yellow #b28600  orange #ca4c16  red    #dc312e  green  #859900

# Status bar: bottom, centered window list, transparent background
set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-interval 1
set -g status-style "fg=#9fabad,bg=default"
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0

# Window pills: "<number> <title>", current one highlighted
setw -g window-status-separator " "
setw -g window-status-style "none"
setw -g window-status-activity-style "none"
setw -g window-status-format "#[fg=#586e74,bg=#002d38] #I #[fg=#9fabad,bg=#002d38] #W "
setw -g window-status-current-style "none"
setw -g window-status-current-format "#[fg=#00141a,bg=#278bd3,bold] #I #[fg=#adb8b8,bg=#073541,nobold] #W "

# Panes
set -g pane-border-style "fg=#073541"
set -g pane-active-border-style "fg=#278bd3"
set -g display-panes-colour "#586e74"
set -g display-panes-active-colour "#278bd3"

# Messages, prompts, copy-mode
set -g message-style "fg=#adb8b8,bg=#073541"
set -g message-command-style "fg=#adb8b8,bg=#073541"
set -g mode-style "fg=#00141a,bg=#2aa298"
setw -g clock-mode-colour "#278bd3"
