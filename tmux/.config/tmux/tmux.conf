# Load TPM
set -g @plugin 'tmux-plugins/tpm'
# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

## Theme
# set -g @plugin 'Nybkox/tmux-kanagawa'
# set -g @kanagawa-theme 'dragon'
# set -g @kanagawa-plugins "git cpu-usage ram-usage"
# set -g @kanagawa-ignore-window-colors true
# set -g @kanagawa-show-powerline true
# set -g @kanagawa-show-edge-icons true

# Theme: Solarized Osaka, applied in floating-status.conf

set-option -g status-position bottom

# Colors and terminal capabilities
set -g default-terminal 'tmux-256color'

set-option -g default-command "${SHELL} -l"

# Clipboard integration (macOS pbcopy, Wayland wl-copy, X11 xclip)
set-option -g set-clipboard on
if-shell 'command -v pbcopy' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"'
if-shell '[ -z "$WAYLAND_DISPLAY" ] && command -v xclip' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded ✔️"

# Splits in current path
unbind %
unbind '"'
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Alternate pane
bind-key o select-pane -t :.+

# Maximize pane
unbind z
bind m resize-pane -Z

# Mouse and navigation
set -g mouse on
set-window-option -g mode-keys vi

# Indexes (set to 1 for compatibility)
set -g base-index 1
setw -g pane-base-index 1

# History and integration with nvim
set -g history-limit 5000
set -sg escape-time 0               # Makes ESC in vim more responsive
set -g allow-passthrough on         # For image preview etc.

# Source theme and utility files
# source ~/.config/tmux/theme.conf
# source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

# TPM bootstrap (must be last)
run '~/.tmux/plugins/tpm/tpm'

# Floating-style status pill (after TPM so it overrides the theme)
source ~/.config/tmux/floating-status.conf
